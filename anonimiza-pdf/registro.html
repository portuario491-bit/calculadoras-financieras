<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Crear cuenta gratis — AnonimizaPDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css?v=20260829b">
</head>
<body>
<div class="demo-banner">⚠️ <strong>MODO DEMO</strong> — cuenta y créditos reales, pagos simulados.</div>
<header class="nav">
  <div class="container nav-inner">
    <a href="index.html" class="brand"><span class="brand-mark">A</span>AnonimizaPDF</a>
    <div class="nav-actions"><a href="login.html" class="btn btn-ghost btn-sm">Ya tengo cuenta</a></div>
  </div>
</header>

<main class="section">
  <div class="container">
    <div class="card form-card">
      <h1 style="font-size:24px;margin-bottom:6px">Crea tu cuenta gratis</h1>
      <p class="muted" style="margin-bottom:22px;font-size:14px">5 créditos de regalo, sin tarjeta. Un crédito = una página procesada.</p>
      <div class="form-error" id="formError"></div>
      <form id="formRegistro" novalidate>
        <div class="field">
          <label for="email">Email profesional</label>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="tu@despacho.com">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8" placeholder="Mínimo 8 caracteres">
          <span class="hint">Se guarda cifrada, nunca en texto plano.</span>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btnRegistro">Crear cuenta gratis</button>
      </form>
      <p class="muted" style="margin-top:18px;font-size:12.8px">Al continuar aceptas los <a href="terminos.html" style="text-decoration:underline">términos</a> y la <a href="privacidad.html" style="text-decoration:underline">política de privacidad</a>.</p>
    </div>
  </div>
</main>

<div id="toasts" aria-live="polite"></div>
<script defer src="lib/manifest.js?v=20260829"></script>
<script defer src="common.js?v=20260829"></script>
<script defer src="auth.js?v=20260829"></script>
</body>
</html>
