<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Iniciar sesión — AnonimizaPDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css?v=20260829b">
</head>
<body>
<div class="demo-banner">⏳ <strong>LISTA DE ESPERA</strong> — cuenta y créditos reales; los planes de pago aún no están activos.</div>
<header class="nav">
  <div class="container nav-inner">
    <a href="index.html" class="brand"><span class="brand-mark">A</span>AnonimizaPDF</a>
    <div class="nav-actions"><a href="registro.html" class="btn btn-ghost btn-sm">Crear cuenta</a></div>
  </div>
</header>

<main class="section">
  <div class="container">
    <div class="card form-card">
      <h1 style="font-size:24px;margin-bottom:6px">Inicia sesión</h1>
      <p class="muted" style="margin-bottom:22px;font-size:14px">Accede a tu cuenta de AnonimizaPDF.</p>
      <div class="form-error" id="formError"></div>
      <form id="formLogin" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btnLogin">Entrar</button>
      </form>
      <p class="muted" style="margin-top:18px;font-size:12.8px">¿No tienes cuenta? <a href="registro.html" style="text-decoration:underline;color:var(--accent)">Crea una gratis</a>.</p>
    </div>
  </div>
</main>

<div id="toasts" aria-live="polite"></div>
<script defer src="lib/manifest.js?v=20260829c"></script>
<script defer src="common.js?v=20260829"></script>
<script defer src="auth.js?v=20260829b"></script>
</body>
</html>
